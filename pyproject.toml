[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-admin-display"
version = "1.3.0"
description = "Simplifies the use of function attributes for the django admin and makes mypy happy"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Alexander Frenzel", email = "alex@relatedworks.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "Django>=5.2",
]

[project.urls]
Documentation = "https://github.com/escaped/django-admin-display/blob/master/README.md"
Homepage = "https://github.com/escaped/django-admin-display"
Repository = "https://github.com/escaped/django-admin-display"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=6",
  "pytest-django>=4.9",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["django_admin_display"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"django_admin_display/__init__.py" = ["B010"]

[tool.ruff.format]
quote-style = "preserve"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = [
  "--cov=django_admin_display",
  "--cov-report=term-missing",
  "--durations=10",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["django_admin_display"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]
