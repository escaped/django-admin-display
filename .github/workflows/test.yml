name: Test & Lint

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  lint:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --python 3.10
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Typecheck
        run: uv run --no-sync mypy django_admin_display tests
      - name: Smoke-test documented pre-commit workflow
        run: uvx pre-commit run --all-files
      - name: Build
        run: uv build
      - name: Verify py.typed is packaged
        run: python -m zipfile -l dist/*.whl | grep django_admin_display/py.typed

  test:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            django: "5.2"
          - python: "3.11"
            django: "5.2"
          - python: "3.12"
            django: "5.2"
          - python: "3.12"
            django: "6.0"
          - python: "3.12"
            django: "6.1"
          - python: "3.13"
            django: "5.2"
          - python: "3.13"
            django: "6.0"
          - python: "3.13"
            django: "6.1"
          - python: "3.14"
            django: "5.2"
          - python: "3.14"
            django: "6.0"
          - python: "3.14"
            django: "6.1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Install Django ${{ matrix.django }}
        run: uv pip install "Django==${{ matrix.django }}.*"
      - name: Run tests
        run: uv run --no-sync pytest --cov-report=xml
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: python-${{ matrix.python }}-django-${{ matrix.django }}
          parallel: true

  coveralls:
    name: Coveralls finished
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
